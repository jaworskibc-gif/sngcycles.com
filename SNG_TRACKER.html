<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNG Cycles — Post Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&family=Barlow:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
  --orange:#b91c1c; /* RED ACCENT */
  --dark:#faf7f2;
  --card:#ffffff;
  --card2:#f5f0e8;
  --border:#2c2218;
  --text:#2c2218;
  --muted:#5c4a32;
  --green:#16a34a;
  --blue:#2563eb;
  --heading:'Barlow Condensed',sans-serif;
  --body:'Barlow',sans-serif;
}
  body{background:var(--dark);color:var(--text);font-family:var(--body);line-height:1.5;}
  .hero{background:var(--card2);border-bottom:3px solid var(--border);padding:48px 48px 36px;}
  .hero-eye{font-family:var(--heading);font-size:10px;font-weight:700;letter-spacing:5px;text-transform:uppercase;color:var(--orange);margin-bottom:8px;}
  .hero h1{font-family:var(--heading);font-size:64px;font-weight:900;text-transform:uppercase;line-height:0.9;color:var(--text);}
  .hero h1 span{color:var(--orange);}
  .hero p{font-size:14px;color:var(--muted);margin-top:12px;}
  .stats-bar{display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--card);}
  .stat{flex:1;padding:20px 24px;border-right:2px solid var(--border);}
  .stat:last-child{border-right:none;}
  .stat-num{font-family:var(--heading);font-size:40px;font-weight:900;color:var(--orange);line-height:1;}
  .stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:4px;}
  .grid{padding:24px 48px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
  .day-card{background:var(--card);border:2px solid var(--border);border-radius:10px;padding:18px 20px;cursor:pointer;transition:border-color .15s,background .15s;position:relative;}
  .day-card.done{border-color:var(--green);background:#0c1a0e;}
  .day-card.done .day-num{color:var(--green);}
  .day-card.skipped{border-color:#c0392b;opacity:0.6;}
  .day-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .day-num{font-family:var(--heading);font-size:36px;font-weight:900;color:var(--orange);line-height:1;}
  .day-meta{text-align:right;}
  .day-dow{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
  .day-type{font-size:10px;color:var(--orange);margin-top:2px;}
  .day-title{font-family:var(--heading);font-size:18px;font-weight:900;text-transform:uppercase;color:var(--text);margin-bottom:6px;line-height:1.1;}
  .day-asset{font-size:11px;color:var(--muted);font-family:monospace;margin-bottom:10px;}
  .plat-row{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap;}
  .plat{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:3px;}
  .p-tiktok{background:#010101;border:1px solid #69c9d0;color:#69c9d0;}
  .p-ig{background:rgba(131,58,180,.2);border:1px solid #833ab4;color:#c678dd;}
  .p-yt{background:rgba(255,0,0,.15);border:1px solid #f00;color:#f55;}
  .p-fb{background:rgba(24,119,242,.15);border:1px solid #1877f2;color:#5898d4;}
  .metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px;}
  .metric-input{background:#0a0b0e;border:2px solid var(--border);border-radius:5px;padding:6px 8px;width:100%;color:var(--text);font-family:var(--body);font-size:12px;text-align:center;}
  .metric-input:focus{outline:none;border-color:var(--orange);}
  .metric-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;text-align:center;margin-bottom:3px;}
  .btn-row{display:flex;gap:6px;}
  .btn{flex:1;padding:7px;border:none;border-radius:5px;font-family:var(--heading);font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:opacity .15s;}
  .btn-post{background:var(--orange);color:var(--text);}
  .btn-post:hover{opacity:.85;}
  .btn-skip{background:#1e1e28;color:var(--muted);border:2px solid var(--border);}
  .btn-skip:hover{border-color:#555;}
  .done-badge{position:absolute;top:14px;right:14px;background:var(--green);color:var(--text);font-family:var(--heading);font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:3px 8px;border-radius:4px;display:none;}
  .day-card.done .done-badge{display:block;}
  .note-area{width:100%;background:#0a0b0e;border:2px solid var(--border);border-radius:5px;padding:7px 10px;color:var(--muted);font-family:var(--body);font-size:12px;margin-top:8px;resize:vertical;min-height:40px;}
  .note-area::placeholder{color:#444;}
  .note-area:focus{outline:none;border-color:var(--orange);}
  .section-head{padding:16px 48px 6px;font-family:var(--heading);font-size:11px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--orange);}
  .engage-card{background:rgba(155,89,182,.08);border:1px solid rgba(155,89,182,.3);border-radius:10px;padding:18px 20px;}
  .engage-card .day-title{color:#c678dd;}
  @media(max-width:600px){.grid{padding:16px;}.stats-bar{flex-wrap:wrap;}.stat{min-width:50%;}.hero{padding:32px 24px;}.hero h1{font-size:48px;}}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-eye">SNG Cycles · Post Tracker</div>
  <h1>30-Day<br><span>Tracker</span></h1>
  <p>Mark each day posted. Log views and engagement. Your data tells you what to post next month.</p>
</div>

<div class="stats-bar">
  <div class="stat">
    <div class="stat-num" id="countPosted">0</div>
    <div class="stat-label">Posted</div>
  </div>
  <div class="stat">
    <div class="stat-num" id="countLeft">30</div>
    <div class="stat-label">Remaining</div>
  </div>
  <div class="stat">
    <div class="stat-num" id="totalViews">0</div>
    <div class="stat-label">Total Views</div>
  </div>
  <div class="stat">
    <div class="stat-num" id="topDay">—</div>
    <div class="stat-label">Top Day (Views)</div>
  </div>
</div>

<div class="section-head">Week 1 — Foundation</div>
<div class="grid" id="grid"></div>

<script>
const DAYS = [
  {n:1,dow:"Monday",type:"Bike / Build",title:"I Searched, Found Nothing",asset:"07 — transformation.mp4",plats:["TikTok","IG","YT"]},
  {n:2,dow:"Tuesday",type:"IG Pin",title:"Origin Carousel — PIN THIS",asset:"01 + 04 (2 photos)",plats:["IG"]},
  {n:3,dow:"Wednesday",type:"Bike / Build",title:"Phone Can't Catch This",asset:"08 — holochrome-motion.mp4",plats:["TikTok","IG"]},
  {n:4,dow:"Thursday",type:"Bike / Proof",title:"Built for 5'10\". I'm Not.",asset:"04-founder-scale-garage.jpg",plats:["TikTok"]},
  {n:5,dow:"Friday",type:"Bike / Identity",title:"Shark Not Goldfish",asset:"06-founder-on-bike-vertical.jpg",plats:["TikTok","IG"]},
  {n:6,dow:"Saturday",type:"Bike / Proof",title:"What It Actually Costs",asset:"09 — parts-breakdown.mp4",plats:["TikTok"]},
  {n:7,dow:"Sunday",type:"engage",title:"Engage Day — Reply Everything",asset:"No post",plats:[]},
  {n:8,dow:"Monday",type:"Bike / Hardware",title:"Fork Day",asset:"Holochrome SNG fork photos",plats:["TikTok","IG"]},
  {n:9,dow:"Tuesday",type:"Bike / Hardware",title:"Brake Day",asset:"Brake / wheel close-ups",plats:["TikTok"]},
  {n:10,dow:"Wednesday",type:"Bike / Re-Hook",title:"3 Prototypes. 1,000 Hours.",asset:"07 — transformation.mp4 (re-use)",plats:["TikTok","IG"]},
  {n:11,dow:"Thursday",type:"Bike / Evolution",title:"Unit 22 Before This",asset:"03-prototype-number-22-front.jpg",plats:["IG","TikTok"]},
  {n:12,dow:"Friday",type:"🎬 Shoot Fresh",title:"VIN Stamped — PIN THIS",asset:"SHOOT: VIN plate close-up",plats:["TikTok","IG"]},
  {n:13,dow:"Saturday",type:"Bike / Founder",title:"14 Months of Boxes",asset:"10 — unboxing.mp4",plats:["TikTok","IG"]},
  {n:14,dow:"Sunday",type:"engage",title:"Engage Day — Week 2 Review",asset:"No post",plats:[]},
  {n:15,dow:"Monday",type:"Bike / Competitor",title:"The Stark Eater",asset:"02-gold-270e-beauty-shot.jpg",plats:["TikTok","IG","YT"]},
  {n:16,dow:"Tuesday",type:"Gear / Community",title:"Holo Detail + Story Poll",asset:"05-holo-detail-number-22.jpg",plats:["IG","TikTok"]},
  {n:17,dow:"Wednesday",type:"Bike / Scarcity",title:"300 Units. After That Gone.",asset:"08 — holochrome-motion.mp4 (re-use)",plats:["TikTok"]},
  {n:18,dow:"Thursday",type:"🎬 Shoot Garage",title:"Motor Day",asset:"SHOOT: Motor + wiring B-roll",plats:["TikTok"]},
  {n:19,dow:"Friday",type:"Bike / Tall Rider",title:"6'7\" Founder Re-Hook",asset:"04-founder-scale-garage.jpg (re-use)",plats:["TikTok","IG"]},
  {n:20,dow:"Saturday",type:"🎬 Shoot or Quick",title:"Gas Station Flex",asset:"SHOOT or 09 — parts-breakdown.mp4",plats:["TikTok"]},
  {n:21,dow:"Sunday",type:"engage",title:"Engage Day — Mid-Month Review",asset:"No post",plats:[]},
  {n:22,dow:"Monday",type:"Bike / Weight",title:"202 lbs vs 275",asset:"01-gold-270e-side-garage.jpg (re-use)",plats:["TikTok","IG"]},
  {n:23,dow:"Tuesday",type:"🎬 Shoot Garage",title:"Controller Story",asset:"SHOOT: Controller close-up",plats:["TikTok"]},
  {n:24,dow:"Wednesday",type:"Bike / Founder",title:"Every Bike Was Built for 5'10\"",asset:"06-founder-on-bike-vertical.jpg (re-use)",plats:["IG","TikTok"]},
  {n:25,dow:"Thursday",type:"Bike / Grind",title:"The Garage for 14 Months",asset:"10 — unboxing.mp4 (re-use)",plats:["TikTok"]},
  {n:26,dow:"Friday",type:"⭐ HARD CLOSE",title:"The Number. Get Yours.",asset:"SHOOT: Numbered plate — or 01",plats:["TikTok","IG","YT","FB"]},
  {n:27,dow:"Saturday",type:"🎬 Quick Garage",title:"BTS Wrenching",asset:"SHOOT: Whatever you're working on",plats:["TikTok"]},
  {n:28,dow:"Sunday",type:"🎬 Reply on Cam",title:"Stitch Your Best Comment",asset:"TikTok native stitch / on camera",plats:["TikTok"]},
  {n:29,dow:"Monday",type:"Re-Hook Winner",title:"Best Performer — New Hook",asset:"Your #1 post from Days 1–28",plats:["TikTok","IG"]},
  {n:30,dow:"Tuesday",type:"Community",title:"Q&A — Answer the Month",asset:"SHOOT: On camera, top 3 questions",plats:["TikTok","IG"]},
];

const PLAT_CLASS = {TikTok:'p-tiktok',IG:'p-ig',YT:'p-yt',FB:'p-fb'};
let data = JSON.parse(localStorage.getItem('sng-tracker')||'{}');

function save(){localStorage.setItem('sng-tracker',JSON.stringify(data));}

function updateStats(){
  let posted=0,totalViews=0,topDay='—',topViews=0;
  DAYS.forEach(d=>{
    const s=data[d.n]||{};
    if(s.posted){posted++;const v=parseInt(s.views||0);totalViews+=v;if(v>topViews){topViews=v;topDay='Day '+d.n;}}
  });
  document.getElementById('countPosted').textContent=posted;
  document.getElementById('countLeft').textContent=30-posted;
  document.getElementById('totalViews').textContent=totalViews>=1000?(totalViews/1000).toFixed(1)+'K':totalViews||'0';
  document.getElementById('topDay').textContent=topDay;
}

function render(){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  let week=0;
  const weekLabels=['Week 1 — Foundation','Week 2 — Proof / Hardware','Week 3 — Identity / Culture','Week 4 — The Close'];
  DAYS.forEach((d,i)=>{
    if(i>0&&i%7===0){
      week++;
      if(week<4){
        const sh=document.createElement('div');
        sh.className='section-head';
        sh.style.gridColumn='1/-1';
        sh.textContent=weekLabels[week];
        grid.appendChild(sh);
      }
    }
    const s=data[d.n]||{};
    const card=document.createElement('div');
    card.className='day-card'+(s.posted?' done':s.skipped?' skipped':'')+(d.type==='engage'?' engage-card':'');
    const platHtml=d.plats.map(p=>`<span class="plat ${PLAT_CLASS[p]||'p-tiktok'}">${p}</span>`).join('');
    card.innerHTML=`
      <div class="done-badge">✓ Posted</div>
      <div class="day-top">
        <div class="day-num">D${String(d.n).padStart(2,'0')}</div>
        <div class="day-meta">
          <div class="day-dow">${d.dow}</div>
          <div class="day-type">${d.type}</div>
        </div>
      </div>
      <div class="day-title">${d.title}</div>
      <div class="day-asset">${d.asset}</div>
      ${d.plats.length?`<div class="plat-row">${platHtml}</div>`:''}
      ${d.type!=='engage'?`
      <div class="metrics">
        <div><div class="metric-label">Views</div><input class="metric-input" type="text" placeholder="0" value="${s.views||''}" data-field="views" data-day="${d.n}"></div>
        <div><div class="metric-label">Likes</div><input class="metric-input" type="text" placeholder="0" value="${s.likes||''}" data-field="likes" data-day="${d.n}"></div>
        <div><div class="metric-label">DMs</div><input class="metric-input" type="text" placeholder="0" value="${s.dms||''}" data-field="dms" data-day="${d.n}"></div>
      </div>
      <textarea class="note-area" placeholder="Notes (best comment, objections, what to re-hook...)" data-field="note" data-day="${d.n}">${s.note||''}</textarea>
      <div class="btn-row" style="margin-top:10px;">
        <button class="btn btn-post" data-day="${d.n}" data-action="post">${s.posted?'↩ Mark Unposted':'✓ Mark Posted'}</button>
        <button class="btn btn-skip" data-day="${d.n}" data-action="skip">${s.skipped?'Restore':'Skip'}</button>
      </div>`:'<div style="font-size:13px;color:var(--muted);margin-top:8px;">Reply to all comments. No new post today.</div>'}
    `;
    grid.appendChild(card);
  });

  grid.addEventListener('input',e=>{
    const el=e.target;
    if(!el.dataset.day) return;
    const day=el.dataset.day;
    if(!data[day]) data[day]={};
    data[day][el.dataset.field]=el.value;
    save(); updateStats();
  });

  grid.addEventListener('click',e=>{
    const btn=e.target.closest('[data-action]');
    if(!btn) return;
    const day=btn.dataset.day;
    if(!data[day]) data[day]={};
    if(btn.dataset.action==='post'){
      data[day].posted=!data[day].posted;
      if(data[day].posted) data[day].skipped=false;
    } else {
      data[day].skipped=!data[day].skipped;
      if(data[day].skipped) data[day].posted=false;
    }
    save(); render(); updateStats();
  });
  updateStats();
}
render();
</script>
</body>
</html>
