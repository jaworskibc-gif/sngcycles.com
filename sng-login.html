<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — SNG Cycles</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: #0c0d10;
  font-family: 'Barlow', sans-serif;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  width: 100%;
  max-width: 360px;
  padding: 44px 36px 40px;
  background: #13141a;
  border: 1px solid #252630;
  border-top: 3px solid #f47820;
  border-radius: 10px;
  text-align: center;
}
.brand {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: #fff;
  margin-bottom: 4px;
}
.brand span { color: #f47820; }
.sub {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #7a7a90;
  margin-bottom: 32px;
}
input[type="password"] {
  width: 100%;
  padding: 14px 18px;
  background: #0a0b0e;
  border: 1px solid #252630;
  border-radius: 7px;
  color: #fff;
  font-size: 20px;
  font-family: inherit;
  letter-spacing: 6px;
  text-align: center;
  outline: none;
  transition: border-color 0.2s;
  margin-bottom: 12px;
}
input[type="password"]:focus { border-color: #f47820; }
input[type="password"].error { border-color: #e74c3c; animation: shake 0.3s; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}
.err-msg { font-size: 12px; color: #e74c3c; min-height: 18px; margin-bottom: 12px; }
button {
  width: 100%;
  padding: 14px;
  background: #f47820;
  border: none;
  border-radius: 7px;
  color: #fff;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  transition: opacity 0.2s;
}
button:hover { opacity: 0.88; }
.back { display: block; margin-top: 20px; font-size: 12px; color: #3a3a52; text-decoration: none; }
.back:hover { color: #f47820; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">SNG<span>.</span></div>
  <div class="sub">Shark Not Goldfish</div>
  <input type="password" id="pw" placeholder="••••••••••" autofocus autocomplete="current-password">
  <div class="err-msg" id="err"></div>
  <button onclick="tryLogin()">Enter</button>
  <a class="back" href="index.html">← Back to site</a>
</div>
<script>
const HASH = 'f0d1f82a60d8332ecb4e3eaf7b779e94a251ddf2becbbddd240118d853895b35';
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function tryLogin() {
  const pw = document.getElementById('pw').value;
  const hash = await sha256(pw);
  if (hash === HASH) {
    sessionStorage.setItem('sng_auth', 'ok');
    const dest = sessionStorage.getItem('sng_return') || 'SNG_HUB.html';
    sessionStorage.removeItem('sng_return');
    location.href = dest;
  } else {
    const input = document.getElementById('pw');
    input.classList.add('error');
    document.getElementById('err').textContent = 'Incorrect password.';
    setTimeout(() => input.classList.remove('error'), 400);
    input.value = '';
    input.focus();
  }
}
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
</script>
</body>
</html>
