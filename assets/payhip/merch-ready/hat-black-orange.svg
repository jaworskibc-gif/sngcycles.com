<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">

  <!-- page bg -->
  <rect width="900" height="900" fill="#0c0d10"/>

  <!-- floor shadow -->
  <ellipse cx="450" cy="805" rx="335" ry="18" fill="#000" opacity="0.60"/>

  <!-- ── BRIM (flat snapback — straight horizontal bill) ── -->
  <!-- Brim face: nearly a straight rectangle, flat bill -->
  <path d="M 80 688 L 820 688 L 820 720 L 80 720 Z"
        fill="#0d0f11"/>
  <!-- Brim underside strip (dark edge at front) -->
  <path d="M 80 720 L 820 720 L 820 733 L 80 733 Z"
        fill="#000000" opacity="0.75"/>
  <!-- Brim top stitching row -->
  <path d="M 108 694 L 792 694"
        fill="none" stroke="#f47820" stroke-width="2.2"
        stroke-dasharray="10 7" opacity="0.28"/>

  <!-- ── FRONT PANEL (structured 6-panel snapback — vertical sides, arch top) ── -->
  <path d="
    M 178 686
    L 178 390
    C 178 248 298 200 450 197
    C 602 200 722 248 722 390
    L 722 686
    Z"
    fill="#111316"/>

  <!-- Left side-panel shadow band (gives depth to the 6-panel seam) -->
  <path d="
    M 178 686
    L 178 390
    C 178 248 298 200 348 208
    L 335 686
    Z"
    fill="#000000" opacity="0.14"/>

  <!-- Right side-panel shadow band -->
  <path d="
    M 722 686
    L 722 390
    C 722 248 602 200 552 208
    L 565 686
    Z"
    fill="#000000" opacity="0.14"/>

  <!-- Left panel seam -->
  <path d="M 178 686 L 178 390 C 178 248 298 200 450 197"
        fill="none" stroke="#000000" stroke-width="1.8" opacity="0.45"/>
  <!-- Right panel seam -->
  <path d="M 722 686 L 722 390 C 722 248 602 200 450 197"
        fill="none" stroke="#000000" stroke-width="1.8" opacity="0.45"/>
  <!-- Center seam (very faint) -->
  <line x1="450" y1="200" x2="450" y2="686"
        stroke="#000000" stroke-width="1.2" opacity="0.22"/>

  <!-- Sweatband seam at base -->
  <path d="M 172 686 Q 450 694 728 686"
        fill="none" stroke="#000002" stroke-width="2.5" opacity="0.35"/>

  <!-- Crown top button -->
  <circle cx="450" cy="201" r="18" fill="#000002" stroke="#000000" stroke-width="2.5"/>
  <circle cx="450" cy="201" r="8"  fill="#000000"/>

  <!-- Eyelets (air vents on side panels) -->
  <ellipse cx="242" cy="440" rx="7" ry="9"
           fill="#000000" stroke="#07090c" stroke-width="1.5"/>
  <ellipse cx="658" cy="440" rx="7" ry="9"
           fill="#000000" stroke="#07090c" stroke-width="1.5"/>

  <!-- ── EMBROIDERY LOGO ── -->

  <!-- Shark fin (clean angular outline, filled) -->
  <path d="
    M 450 328
    C 448 328 420 378 416 412
    C 428 403 440 409 450 414
    C 460 409 472 403 484 412
    C 480 378 452 328 450 328 Z"
    fill="#f47820" opacity="0.97"/>
  <!-- Fin base rule -->
  <line x1="408" y1="414" x2="492" y2="414"
        stroke="#f47820" stroke-width="5" stroke-linecap="round" opacity="0.95"/>

  <!-- SNG (large bold) -->
  <text x="450" y="545"
        text-anchor="middle"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900"
        font-size="122"
        fill="#f47820"
        letter-spacing="3"
        opacity="0.97">SNG</text>

  <!-- CYCLES (small caps, tracked wide) -->
  <text x="450" y="608"
        text-anchor="middle"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900"
        font-size="41"
        fill="#f47820"
        letter-spacing="14"
        opacity="0.88">CYCLES</text>

</svg>